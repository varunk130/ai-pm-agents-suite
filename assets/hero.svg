<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" fill="none" role="img" aria-label="AI PM Agents Suite — Multi-agent AI that does the synthesis, modeling, and stakeholder framing for product managers">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1733"/>
      <stop offset="50%" style="stop-color:#142447"/>
      <stop offset="100%" style="stop-color:#0a1733"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4c430"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="76" x2="1200" y2="76"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="304" x2="1200" y2="304"/>
  </g>

  <!-- Glow accents -->
  <ellipse cx="200" cy="190" rx="240" ry="140" fill="#d4af37" opacity="0.06"/>
  <ellipse cx="1000" cy="190" rx="240" ry="140" fill="#d4af37" opacity="0.06"/>

  <!-- Top gold accent line -->
  <rect x="80" y="42" width="80" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Logo glyph: 2x2 agent network in gold -->
  <g transform="translate(80, 62)">
    <rect width="56" height="56" rx="12" fill="#d4af37" opacity="0.15"/>
    <circle cx="18" cy="18" r="5" fill="#f4c430"/>
    <circle cx="38" cy="18" r="5" fill="#f4c430" opacity="0.75"/>
    <circle cx="18" cy="38" r="5" fill="#f4c430" opacity="0.75"/>
    <circle cx="38" cy="38" r="5" fill="#f4c430"/>
    <line x1="18" y1="18" x2="38" y2="18" stroke="#f4c430" stroke-width="1.5" opacity="0.6"/>
    <line x1="18" y1="38" x2="38" y2="38" stroke="#f4c430" stroke-width="1.5" opacity="0.6"/>
    <line x1="18" y1="18" x2="18" y2="38" stroke="#f4c430" stroke-width="1.5" opacity="0.6"/>
    <line x1="38" y1="18" x2="38" y2="38" stroke="#f4c430" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="156" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">AI PM Agents Suite</text>

  <!-- One-line description -->
  <text x="156" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#e8d18a">Multi-agent AI that does the synthesis, modeling, and stakeholder framing — so PMs can focus on strategy.</text>

  <!-- Divider -->
  <rect x="80" y="170" width="1040" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- LEFT COLUMN: What's included -->
  <text x="80" y="208" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="url(#gold)" letter-spacing="2">WHAT'S INCLUDED</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
    <!-- Item 1 -->
    <text x="80" y="240" font-size="17" font-weight="600">6-agent feedback-to-strategy pipeline</text>
    <text x="80" y="262" font-size="14" font-weight="400" opacity="0.75">Raw tickets + metrics → PRD, strategy, stakeholder comms</text>

    <!-- Item 2 -->
    <text x="80" y="296" font-size="17" font-weight="600">3 standalone PM copilots</text>
    <text x="80" y="318" font-size="14" font-weight="400" opacity="0.75">Decision Engine · Financial Analyst · Stakeholder Translator</text>
  </g>

  <!-- RIGHT COLUMN: Value delivered -->
  <text x="640" y="208" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="url(#gold)" letter-spacing="2">VALUE DELIVERED</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff" font-size="15" font-weight="500">
    <!-- Bullet 1 -->
    <circle cx="650" cy="234" r="3" fill="#f4c430"/>
    <text x="666" y="239">Strategy synthesized from messy qualitative + quantitative inputs</text>

    <!-- Bullet 2 -->
    <circle cx="650" cy="266" r="3" fill="#f4c430"/>
    <text x="666" y="271">Defensible business cases with explicit assumption sourcing</text>

    <!-- Bullet 3 -->
    <circle cx="650" cy="298" r="3" fill="#f4c430"/>
    <text x="666" y="303">Audience-ready communications without the rewrite cycle</text>

    <!-- Bullet 4 -->
    <circle cx="650" cy="330" r="3" fill="#f4c430"/>
    <text x="666" y="335">Hours of PM grunt work, compressed into seconds</text>
  </g>
</svg>
